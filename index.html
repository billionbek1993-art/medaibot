<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Med-AI Core - Qoraqalpog‘iston Tibbiyot Instituti</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --bg-dark: #050505; }
        body { background-color: var(--bg-dark); color: #e0e0e0; font-family: 'Rajdhani', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .gradient-text { background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 20px; margin-bottom: 12px; font-size: 0.95rem; animation: fadeIn 0.3s ease-out; word-wrap: break-word; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bot-msg { background: rgba(0, 242, 255, 0.08); border-left: 3px solid var(--neon-blue); align-self: flex-start; }
        .user-msg { background: rgba(188, 19, 254, 0.08); border-right: 3px solid var(--neon-purple); align-self: flex-end; }
        .page { display: none; height: 100%; width: 100%; padding: 16px; flex-direction: column; }
        .page.active { display: flex; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        .quiz-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; align-items: center; justify-content: center; }
        .quiz-overlay.active { display: flex; }
        .timer-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        #timer-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); }
        .option-btn { transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="quiz-overlay">
        <div class="glass-panel w-full max-w-md p-6 relative shadow-[0_0_50px_rgba(0,242,255,0.15)]">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-stopwatch text-cyan-400"></i>
                    <span id="quiz-timer-text" class="orbitron text-cyan-400 font-bold text-xl">30s</span>
                </div>
                <button onclick="window.closeQuiz()" class="text-gray-500 hover:text-white transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="timer-bar"><div id="timer-fill"></div></div>
            <div id="quiz-content">
                <h3 id="quiz-question" class="text-lg font-bold mb-6 leading-relaxed">Savol yuklanmoqda...</h3>
                <div id="quiz-options" class="space-y-3"></div>
            </div>
            <div id="quiz-feedback" class="hidden mt-4 p-3 rounded-xl text-center font-bold orbitron text-xs"></div>
        </div>
    </div>

    <!-- Profil Sahifasi -->
    <main id="profile-page" class="page">
        <header class="flex justify-between items-center mb-6">
            <button onclick="showPage('main-page')" class="text-gray-400 p-2"><i class="fas fa-arrow-left text-xl"></i></button>
            <h1 class="orbitron text-xl font-bold gradient-text">PROFIL</h1>
            <div class="w-10"></div>
        </header>
        <div class="glass-panel p-6 flex flex-col items-center text-center mb-6">
            <div class="h-20 w-20 rounded-full border-2 border-cyan-500 p-1 mb-4 shadow-[0_0_15px_rgba(0,242,255,0.3)]">
                <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Medical" class="rounded-full bg-cyan-900/30">
            </div>
            <input type="text" id="name-input" placeholder="Ismingiz..." class="bg-transparent text-center text-xl font-bold text-white outline-none border-b border-white/10 focus:border-cyan-500 w-full pb-2 mb-2">
            <p id="user-id-display" class="text-[10px] text-gray-600 mb-4 font-mono"></p>
            <div class="w-full grid grid-cols-2 gap-4">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <p class="text-gray-500 text-[10px] uppercase">Ball</p>
                    <p id="total-score" class="text-2xl font-bold text-cyan-400">0</p>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <p class="text-gray-500 text-[10px] uppercase">Maqom</p>
                    <p id="rank-display" class="text-lg font-bold text-purple-400">INTERN</p>
                </div>
            </div>
            <button id="save-profile-btn" class="mt-6 text-[10px] orbitron bg-white/5 px-4 py-2 rounded-full border border-white/10 hover:bg-white/10">SAQLASH</button>
        </div>
        <div class="glass-panel p-5 flex-grow overflow-hidden flex flex-col">
            <h3 class="orbitron text-xs font-bold mb-4 text-gray-400 tracking-widest uppercase">Global Reyting</h3>
            <div id="leaderboard" class="space-y-3 overflow-y-auto pr-1"></div>
        </div>
    </main>

    <!-- Asosiy Chat Sahifasi -->
    <main id="main-page" class="page active">
        <header class="w-full flex items-center justify-between mb-4">
            <div class="flex flex-col">
                <h1 class="orbitron text-xl font-bold gradient-text leading-tight">MED-AI CORE</h1>
                <div id="connection-status" class="text-[9px] flex items-center text-gray-500 uppercase">
                    <span class="status-dot status-offline"></span> Bog'lanish...
                </div>
            </div>
            <button onclick="showPage('profile-page')" class="h-10 w-10 rounded-full border border-cyan-500/50 flex items-center justify-center bg-cyan-500/10 shadow-[0_0_10px_rgba(0,242,255,0.2)]">
                <i class="fas fa-user-md text-cyan-400"></i>
            </button>
        </header>

        <div id="chat-window" class="glass-panel flex-grow p-4 overflow-y-auto flex flex-col space-y-3 mb-4">
            <div class="chat-bubble bot-msg">Salom! Men Qoraqalpog'iston Tibbiyot Instituti Med-AI yordamchisiman. Davranbek tarafidan ishlap chiqilgan.</div>
        </div>

        <div class="flex flex-col gap-3">
            <div class="relative flex items-center gap-2 bg-white/5 p-2 rounded-2xl border border-white/10 focus-within:border-cyan-500/50 transition-colors">
                <input type="text" id="user-input" placeholder="Savol yo'llang..." class="bg-transparent flex-grow outline-none py-2 px-3 text-white text-sm">
                <button id="send-btn" class="bg-cyan-500 text-black font-bold h-10 w-12 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(0,242,255,0.4)]">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="document.getElementById('file-upload').click()" class="glass-panel py-3 flex flex-col items-center gap-1 border-emerald-500/30">
                    <i class="fas fa-file-word text-emerald-400 text-lg"></i>
                    <span class="text-[9px] font-bold uppercase">Hujjat</span>
                    <input type="file" id="file-upload" class="hidden" accept=".doc,.docx,.xls,.xlsx,.txt" onchange="window.handleFileUpload(this)">
                </button>
                <button onclick="document.getElementById('mrt-upload').click()" class="glass-panel py-3 flex flex-col items-center gap-1 border-blue-500/30">
                    <i class="fas fa-microscope text-blue-400 text-lg"></i>
                    <span class="text-[9px] font-bold uppercase">Tahlil</span>
                    <input type="file" id="mrt-upload" class="hidden" accept="image/*" onchange="window.handleImageUpload(this)">
                </button>
                <button onclick="window.clearHistory()" class="glass-panel py-3 flex flex-col items-center gap-1 text-gray-500">
                    <i class="fas fa-eraser text-sm"></i>
                    <span class="text-[9px] font-bold uppercase">Tozalash</span>
                </button>
            </div>
        </div>
        <div class="text-center text-[10px] text-gray-600 mt-2 font-mono">@med_future_bot</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Firebase konfiguratsiyasi siz bergan ma'lumotlar bilan
        const firebaseConfig = {
            apiKey: "AIzaSyB3PyASFMm0kmsfZ1m08pnSTTtdQM6HduU",
            authDomain: "medaibot.firebaseapp.com",
            projectId: "medaibot",
            storageBucket: "medaibot.firebasestorage.app",
            messagingSenderId: "1093589950084",
            appId: "1:1093589950084:web:ee03113bcb7a09e0d36cd1",
            measurementId: "G-GXB2N0DDXV"
        };

        // Gemini AI API Key (Siz bergan ikkinchi kalit)
        const geminiApiKey = "AIzaSyBdXrY1w1C4XmfpimyOIslzNjQIXAD3TRg";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const tg = window.Telegram?.WebApp;
        const appId = "medaibot_v1";
        
        let currentUser = null;
        let userData = { name: tg?.initDataUnsafe?.user?.first_name || "Shifokor", score: 0, rank: "INTERN" };

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                currentUser = u;
                document.getElementById('connection-status').innerHTML = '<span class="status-dot status-online"></span> ONLAYN';
                document.getElementById('user-id-display').innerText = `UID: ${u.uid}`;
                loadUserData();
            } else {
                await signInAnonymously(auth);
            }
        });

        async function loadUserData() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data');
            const snap = await getDoc(docRef);
            if (snap.exists()) userData = { ...userData, ...snap.data() };
            updateUI();

            const lbCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            onSnapshot(lbCol, (s) => {
                const list = [];
                s.forEach(d => list.push(d.data()));
                renderLeaderboard(list);
            });
        }

        async function saveUserData() {
            if (!currentUser) return;
            const uRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data');
            const lRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
            await setDoc(uRef, userData);
            await setDoc(lRef, { name: userData.name, score: userData.score, rank: userData.rank, uid: currentUser.uid });
            updateUI();
        }

        function updateUI() {
            document.getElementById('total-score').innerText = userData.score;
            document.getElementById('name-input').value = userData.name;
            document.getElementById('rank-display').innerText = userData.rank;
        }

        function renderLeaderboard(list) {
            list.sort((a, b) => b.score - a.score);
            document.getElementById('leaderboard').innerHTML = list.slice(0, 10).map((p, i) => `
                <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5">
                    <span class="text-xs">#${i+1} ${p.name}</span>
                    <span class="text-cyan-400 font-bold text-xs">${p.score} XP</span>
                </div>
            `).join('');
        }

        async function fetchAI(prompt, img = null, isJson = false) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "Siz Qoraqalpog'iston Tibbiyot Instituti yordamchisiz. Professional tibbiy javob bering." }] }
            };
            if (img) payload.contents[0].parts.push({ inlineData: { mimeType: "image/png", data: img } });
            if (isJson) payload.generationConfig = { responseMimeType: "application/json" };

            const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            return isJson ? JSON.parse(text) : text;
        }

        window.addMsg = (txt, role) => {
            const d = document.createElement('div');
            d.className = `chat-bubble ${role}-msg`;
            d.innerHTML = txt.replace(/\n/g, '<br>');
            const win = document.getElementById('chat-window');
            win.appendChild(d);
            win.scrollTop = win.scrollHeight;
            return d;
        };

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        document.getElementById('send-btn').onclick = async () => {
            const val = document.getElementById('user-input').value.trim();
            if (!val) return;
            document.getElementById('user-input').value = "";
            window.addMsg(val, 'user');
            const loader = window.addMsg("Tahlil qilinmoqda...", 'bot');
            try {
                const res = await fetchAI(val);
                loader.innerHTML = res.replace(/\n/g, '<br>');
            } catch (e) { loader.innerText = "Xatolik yuz berdi."; }
        };

        document.getElementById('save-profile-btn').onclick = () => {
            userData.name = document.getElementById('name-input').value.trim() || "Shifokor";
            saveUserData();
            window.showPage('main-page');
        };

        if (tg) tg.ready();
    </script>
</body>
</html>
